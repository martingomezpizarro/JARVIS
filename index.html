<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0b07" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jarvis" />
  <title>Dashboard — Martín (Guerrero Dragón)</title>

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Georgia', 'ui-serif', 'serif'],
            sans: ['system-ui', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Tema claro/oscuro: se aplica antes de pintar para que no haya parpadeo -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('martin:tema') || 'dark';
        document.documentElement.classList.toggle('dark', t !== 'light');
      } catch (e) { document.documentElement.classList.add('dark'); }
    })();
  </script>

  <!-- React + ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Lucide (UMD) — pineado para evitar breaking changes de @latest -->
  <script src="https://unpkg.com/lucide@1.23.0/dist/umd/lucide.js"></script>

  <!-- Datos de sincronización (cargados como JS global — funciona desde file://)
       OJO CON EL "../": el dashboard vive en Jarvis_CoWork\Jarvis\ pero los
       archivos de datos los siguen generando los skills y sync_server.py en
       Jarvis_CoWork\ (la carpeta de arriba). Con "../" apunta bien tanto
       servido por HTTP (localhost:8765/Jarvis/...) como abierto con file://.
       Asi hay UNA sola copia de los datos y el boton "Sincronizar" sigue
       leyendo lo que sync_server.py acaba de escribir. -->
  <!-- Estos archivos son generados automáticamente por los skills de sincronización -->
  <script src="../rutina_sync_data.js" onerror="console.log('[Jarvis] rutina_sync_data.js no encontrado, se usará fetch o defaults.')"></script>
  <script src="../objetivos_sync_data.js" onerror="console.log('[Jarvis] objetivos_sync_data.js no encontrado, se usará fetch o defaults.')"></script>
  <script src="../objetivos_lp_data.js" onerror="console.log('[Jarvis] objetivos_lp_data.js no encontrado, se usará seed interno.')"></script>

  <style>
    html, body, #root { min-height: 100vh; }
    body { background: #fafaf9; }
    .dark body { background: #0a0a0a; }

    /* ========================================================================
       TOKENS — vista "I have a dream" (Objetivos de largo plazo).
       Única fuente de color de esa vista. Ningún hex literal en el markup.
       La tarjeta es CLARA a propósito, sobre el canvas oscuro de la app:
       por eso acá NO hay variantes dark: — así ningún input queda negro
       dentro de un panel claro.
       ==================================================================== */
    :root {
      --card:            #FFFFFF;
      --col-2:           #F1EFE8;
      --col-3:           #F7F6F1;
      --col-4:           #FFFFFF;

      /* La jerarquía se hace con TAMAÑO y PESO, no con palidez: los tres niveles
         de texto son oscuros. Así ningún nivel "se pierde". */
      --text-primary:    #14140F;
      --text-secondary:  #45443F;
      --text-muted:      #6B6960;

      --border:          #DCD9CF;
      --border-strong:   #B9B5A8;

      --accent:          #B45309;   /* acciones: guardar */
      --accent-bg:       #FAEEDA;
      --accent-fg:       #7C3A06;
      --on-solid:        #FFFFFF;   /* texto sobre un botón sólido */
      --track-on-tint:   rgba(0,0,0,0.08); /* fondo de la barra de progreso sobre el tinte del área */
      --danger:          #A32D2D;   /* eliminar */
      --danger-bg:       #FCEBEB;
      --success:         #3B6D11;
      --success-bg:      #EAF3DE;
      --neutral-pill-bg: #F1EFE8;

      --focus-ring:      #B45309;

      /* Tintes de área. Cada área guarda el NOMBRE del token, no un hex.
         Los 12 primeros conservan la identidad cálida actual del dashboard
         (ámbar / ocre / terracota); los 5 últimos son la paleta fría
         opcional. Todos los -fg dan ≥ 4.5:1 sobre su -bg. */
      --area-ambar-bg:      #FBEDC4;  --area-ambar-fg:      #4A3504;
      --area-oro-bg:        #F9E9BC;  --area-oro-fg:        #493403;
      --area-ocre-bg:       #F9E3C1;  --area-ocre-fg:       #4D2F03;
      --area-naranja-bg:    #F9DECD;  --area-naranja-fg:    #56230A;
      --area-terracota-bg:  #F8DFCB;  --area-terracota-fg:  #53260A;
      --area-ladrillo-bg:   #F9DBD6;  --area-ladrillo-fg:   #5A1C17;
      --area-bronce-bg:     #F6E7C3;  --area-bronce-fg:     #453105;
      --area-mostaza-bg:    #F5EBBB;  --area-mostaza-fg:    #413503;
      --area-siena-bg:      #F7DFD1;  --area-siena-fg:      #4E2510;
      --area-umbra-bg:      #F1E6D6;  --area-umbra-fg:      #3E2D1A;
      --area-topo-bg:       #F2E9DA;  --area-topo-fg:       #3E3020;
      --area-arena-bg:      #F8EFD8;  --area-arena-fg:      #43371C;
      --area-azul-bg:       #DCEAF8;  --area-azul-fg:       #082F57;
      --area-violeta-bg:    #E7E5FD;  --area-violeta-fg:    #292361;
      --area-verdemar-bg:   #D5F0E6;  --area-verdemar-fg:   #05372C;
      --area-coral-bg:      #F8E3DB;  --area-coral-fg:      #4E1D0D;
      --area-verde-bg:      #E1EFCF;  --area-verde-fg:      #1B3707;
    }

    /* Foco de teclado visible en todos los controles de la vista */
    .lp-view :is(button, input, select, textarea, [tabindex]):focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 1px;
      border-radius: 8px;
    }
    /* Hairlines */
    .lp-hair-l { border-left: 0.5px solid var(--border); }
    .lp-hair-t { border-top: 0.5px solid var(--border); }
    /* Destino válido de arrastre */
    .lp-drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
    /* Acciones de fila: visibles al hover en desktop, permanentes en touch */
    .lp-row-actions { opacity: 0; transition: opacity .12s; }
    .lp-row:hover .lp-row-actions,
    .lp-row:focus-within .lp-row-actions { opacity: 1; }
    @media (hover: none) { .lp-row-actions { opacity: 1; } }
    .lp-grab { touch-action: none; cursor: grab; }
    .lp-grab:active { cursor: grabbing; }
  </style>

<body class="antialiased text-neutral-900 dark:text-neutral-100">
  <div id="root"></div>

  <!-- Diagnóstico: si algo falla, mostrar el error en pantalla en vez de quedar en blanco -->
  <script>
    (function () {
      function mostrar(msg) {
        var root = document.getElementById("root");
        if (root && root.children.length === 0) {
          root.innerHTML =
            '<div style="max-width:640px;margin:60px auto;padding:24px;font-family:monospace;font-size:13px;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;white-space:pre-wrap;">' +
            "⚠️ El dashboard no pudo cargar:\n\n" + msg +
            "\n\nSi estás viendo esto en la vista previa de Claude/Cowork: esa vista no tiene internet y este dashboard necesita los CDN de React y Tailwind. Abrilo con el botón “Abrir en Google Chrome”." +
            "</div>";
        }
      }
      window.addEventListener("error", function (e) {
        mostrar((e.message || String(e.error || "Error desconocido")) + (e.filename ? "\n" + e.filename + ":" + e.lineno : ""));
      });
      window.addEventListener("load", function () {
        setTimeout(function () {
          if (!window.React || !window.ReactDOM || !window.Babel) {
            mostrar("No se pudieron descargar React/Babel desde el CDN (sin conexión a internet en esta vista).");
          } else {
            var root = document.getElementById("root");
            if (root && root.children.length === 0) {
              mostrar("React cargó pero el dashboard no montó. Revisá la consola (F12) por un error de sintaxis JSX.");
            }
          }
        }, 4000);
      });
    })();
  </script>

  <!-- ── ADAPTACIÓN A CELULAR ──────────────────────────────────────────
       Todo acá es CSS: no cambia la lógica de ninguna vista. Tres frentes:
       (1) lo que solo se veía con hover, en un celular no se ve nunca;
       (2) la letra de 8-10px es ilegible en una pantalla chica;
       (3) los botones de 20px son imposibles de apuntar con el dedo. -->
  <style>
    /* Respeta la barra de estado / notch cuando está instalada como app */
    body { padding-bottom: env(safe-area-inset-bottom); }

    /* ── Dispositivos sin mouse (celular y tablet) ───────────────────── */
    @media (hover: none) {
      /* Los botones de editar / eliminar / archivar viven detrás de un hover.
         Sin mouse no hay hover: se muestran siempre, algo atenuados. */
      .group-hover\:opacity-100 { opacity: 1 !important; }
      .opacity-0.group-hover\:opacity-100 { opacity: .65 !important; }
    }

    /* ── Ancho siempre pegado a la pantalla ──────────────────────────────
       Si algún elemento desborda a lo ancho, el navegador agranda el lienzo
       y al alejar con zoom el contenido queda chico y pegado a la izquierda,
       con una banda vacía al costado. Con esto el lienzo nunca supera la
       pantalla: el contenido se adapta al ancho visible, con o sin zoom. */
    html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
    #root { min-width: 0; max-width: 100%; }
    #root img, #root svg, #root table { max-width: 100%; }

    /* ── Pantallas chicas ────────────────────────────────────────────── */
    @media (max-width: 767px) {
      /* "I have a dream": las 4 columnas se deslizan hacia el costado con el
         dedo. El ancho mínimo garantiza que la columna de objetivos tenga
         lugar para el texto, la fecha y los botones de editar/eliminar. */
      .lp-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -0.75rem; padding: 0 .75rem 6px; }
      .lp-scroll .lp-min { min-width: 820px; }
      .lp-scroll .lp-etiquetas { display: flex !important; }

      /* Piso de legibilidad: nada por debajo de 11px */
      .text-\[9px\], .text-\[10px\] { font-size: 11px !important; line-height: 1.35 !important; }
      .text-\[11px\] { font-size: 12px !important; }

      /* Áreas tocables: 40px de alto mínimo en botones y checkboxes */
      button, [role="button"], summary { min-height: 36px; }
      input[type="checkbox"] { width: 20px !important; height: 20px !important; }
      /* ...salvo dentro de la grilla de Semana, que se maneja aparte */
      .jarvis-grid button { min-height: 0; }

      /* Campos de texto a 16px: por debajo de eso iOS hace zoom solo al tocar */
      input[type="text"], input[type="time"], input[type="date"],
      input[type="number"], select, textarea { font-size: 16px !important; }

      /* Las grillas fijas de 7 columnas no entran: pasan a 2 */
      .jarvis-7col { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }

      /* Formularios de 3 columnas → una sola */
      .jarvis-form-3 { grid-template-columns: 1fr !important; }

      /* Popovers anclados a un botón del borde derecho (asignar día/hora a un
         objetivo). En celular no entran: se salían de pantalla y, como el body
         corta el desborde horizontal, quedaban inalcanzables. Acá pasan a ser
         una tarjeta centrada abajo, siempre dentro del ancho visible. */
      .jarvis-popover {
        position: fixed !important;
        left: 50% !important;
        right: auto !important;
        top: auto !important;
        bottom: 14px !important;
        transform: translateX(-50%);
        width: calc(100vw - 24px) !important;
        max-width: 360px;
        margin-top: 0 !important;
        /* Fondo y capa PROPIOS, no heredados de las clases de utilidad: si no,
           el contenido de atrás se leía a través del panel y se mezclaba con
           los botones. Con z-index alto queda siempre por encima de todo. */
        z-index: 210 !important;
        background: #ffffff !important;
        box-shadow: 0 -8px 40px rgba(0,0,0,.55) !important;
      }
      .dark .jarvis-popover { background: #171310 !important; }

      /* Telón detrás del panel: lo despega visualmente de la lista y, al
         tocarlo, lo cierra. En escritorio no existe. */
      .jarvis-popover-fondo {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0,0,0,.55);
      }

      /* Acciones que en escritorio aparecen al pasar el mouse. En pantalla
         táctil no hay mouse: si siguen invisibles, no existen. */
      .jarvis-acciones { opacity: 1 !important; }

      /* Márgenes más finos para ganar ancho útil */
      .jarvis-pad { padding-left: .75rem !important; padding-right: .75rem !important; }
    }

    /* La barra lateral, en celular, se comporta como cajón sobre el contenido */
    @media (max-width: 767px) {
      .jarvis-sidebar { position: fixed !important; top: 0; bottom: 0; left: 0; z-index: 60; }
      .jarvis-sidebar-cerrada { transform: translateX(-100%); }
      .jarvis-backdrop { position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.45); }
    }
    @media (min-width: 768px) { .jarvis-backdrop, .jarvis-fab, .jarvis-popover-fondo { display: none !important; } }
  </style>

  <!-- Shim: window.storage sobre localStorage -->
  <script>
    window.storage = {
      get: function(key) {
        var v = localStorage.getItem(key);
        return Promise.resolve(v === null ? null : { value: v });
      },
      set: function(key, value) {
        localStorage.setItem(key, value);
        if (window.JarvisBackup) window.JarvisBackup.schedule();
        return Promise.resolve();
      },
      remove: function(key) {
        localStorage.removeItem(key);
        return Promise.resolve();
      }
    };

    // Helper para transformar íconos de lucide en componentes React
    function LucideIcon(name) {
      return function LucideIconComponent(props) {
        var size = props.size || 24;
        var color = props.color;
        var className = props.className;
        var style = props.style;
        // Lucide expone íconos como window.lucide.icons[Name] en formato IconNode
        var icons = (window.lucide && (window.lucide.icons || window.lucide)) || {};
        var node = icons[name];
        if (!node) {
          // Fallback: render un placeholder vacío
          return React.createElement('svg', {
            width: size, height: size, style: style, className: className,
            viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor',
            strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round'
          }, React.createElement('circle', { cx: 12, cy: 12, r: 10 }));
        }
        // node es un array de [tag, attrs] o un objeto { toSvg... }.
        // Normalizamos a array.
        var children = [];
        if (Array.isArray(node)) {
          children = node.map(function(item, i) {
            // item puede ser [tag, attrs] o [tag, attrs, kids]
            if (Array.isArray(item)) {
              return React.createElement(item[0], Object.assign({ key: i }, item[1] || {}));
            }
            return null;
          }).filter(Boolean);
        }
        // Algunos builds exponen el ícono como componente renderable directo:
        // en esos casos node.toSvg existe. Lo ignoramos y usamos el array.
        var otherProps = {};
        Object.keys(props).forEach(function(k) {
          if (['size','color','className','style'].indexOf(k) === -1) otherProps[k] = props[k];
        });
        return React.createElement('svg', Object.assign({
          xmlns: 'http://www.w3.org/2000/svg',
          width: size, height: size,
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: color || 'currentColor',
          strokeWidth: 2,
          strokeLinecap: 'round',
          strokeLinejoin: 'round',
          className: className,
          style: style
        }, otherProps), children);
      };
    }
  </script>

  <!-- Dashboard JSX -->
  <!-- Backup a archivo (File System Access API): jarvis_backup.json se escribe solo en cada cambio -->
  <script>
    (function () {
      function idb(mode, val) {
        return new Promise(function (res, rej) {
          var r = indexedDB.open("jarvis-backup", 1);
          r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
          r.onerror = function () { rej(r.error); };
          r.onsuccess = function () {
            var db = r.result;
            var tx = db.transaction("kv", mode === "get" ? "readonly" : "readwrite");
            var st = tx.objectStore("kv");
            var rq = mode === "get" ? st.get("handle") : mode === "set" ? st.put(val, "handle") : st.delete("handle");
            rq.onsuccess = function () { res(rq.result); };
            rq.onerror = function () { rej(rq.error); };
          };
        });
      }
      function collect() {
        var o = {};
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && (k.indexOf("martin:") === 0 || k.indexOf("jarvis:") === 0)) o[k] = localStorage.getItem(k);
        }
        return { app: "jarvis-dashboard", version: 1, savedAt: new Date().toISOString(), data: o };
      }
      function apply(obj) {
        if (!obj || !obj.data) return 0;
        var n = 0, k;
        for (k in obj.data) { if (Object.prototype.hasOwnProperty.call(obj.data, k)) { localStorage.setItem(k, obj.data[k]); n++; } }
        if (obj.savedAt) localStorage.setItem("jarvis:lastSavedAt", obj.savedAt);
        return n;
      }
      // ¿Hay trabajo real en este navegador? (cualquier clave de datos)
      function hayDatosLocales() {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf("martin:") === 0) return true;
        }
        return false;
      }

      var handle = null, name = "", timer = null, statusCb = null, muteSchedule = false;
      function notify() { if (statusCb) statusCb({ connected: !!handle, name: name }); }
      async function ensure(mode) {
        if (!handle) return false;
        var p = await handle.queryPermission({ mode: mode });
        if (p === "granted") return true;
        p = await handle.requestPermission({ mode: mode });
        return p === "granted";

      }

        if (!window.showSaveFilePicker) { alert("Tu navegador no soporta guardar en archivo automático.\nAbrí el dashboard con start_dashboard.bat (localhost) en Chrome/Edge."); return false; }
        handle = await window.showSaveFilePicker({ suggestedName: "jarvis_backup.json", types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
        await idb("set", handle); name = handle.name;
        await write(true); notify(); return true;
      }
      async function restore() {
        if (!handle) {
          if (!window.showOpenFilePicker) { alert("No soportado en este navegador."); return 0; }
          var arr = await window.showOpenFilePicker({ types: [{ description: "JSON", accept: { "application/json": [".json"] } }] });
          handle = arr[0]; await idb("set", handle); name = handle.name;
        }
        if (!(await ensure("read"))) return 0;

        var obj = JSON.parse(await f.text());

          var p = await handle.queryPermission({ mode: "read" });
          notify();
          if (p !== "granted") return 0;
          var f = await handle.getFile();
          var obj = JSON.parse(await f.text());
          if (!(obj && obj.data && Object.keys(obj.data).length)) return 0;
          // GUARDA CRÍTICA: nunca pisar trabajo reciente con un backup viejo.
          // Si en este navegador ya hay datos y el archivo es anterior a la
          // última vez que guardamos, el archivo está desactualizado (típico:
          // se perdió el permiso de escritura). Se ignora y se avisa.

        } catch (e) { return 0; }
      }

      function exportCopy() {
        var blob = new Blob([JSON.stringify(collect(), null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a"); a.href = url; a.download = "jarvis_backup.json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      }
      // Importar desde un File cualquiera (el que devuelve <input type="file">).
      // Anda en TODOS los navegadores, incluido el celular.
      function importFile(file) {
        return new Promise(function (resolve) {
          if (!file) { resolve(0); return; }
          var fr = new FileReader();
          fr.onload = function () {
            try {
              var obj = JSON.parse(fr.result);
              if (!obj || !obj.data) { resolve(-1); return; }

            } catch (e) { resolve(-1); }

      function estadoLogin(txt) {
        var d = document.getElementById("jarvis-login-estado");
        if (d) d.textContent = txt || "";
      }

      function cerrarLogin() {
        loginAbierto = false;
        var root = document.getElementById("root");
        if (root) root.innerHTML = "";
      }

      function proveedor() {
        var p = new firebase.auth.GoogleAuthProvider();
        p.setCustomParameters({ prompt: "select_account" });
        return p;
      }

      // SIEMPRE popup, en la compu y en el celular. El redirect entre esta
      // página y firebaseapp.com está roto en los Chrome modernos (particionan
      // el almacenamiento entre sitios): Google autenticaba bien pero el
      // resultado nunca volvía, y la app te devolvía a la pantalla de ingreso.
      // El popup no depende de ese almacenamiento, así que funciona en los dos
      // lados. El redirect queda como último recurso si el popup está
      // bloqueado (y si tampoco anda, el cartel lo dice).
      function pedirLogin() {
        estadoLogin("Abriendo Google…");
        try {
          firebase.auth().signInWithPopup(proveedor()).catch(function (e) {
            var c = (e && e.code) || "";
            if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") {
              estadoLogin("");   // la persona cerró la ventanita: no es un error
              return;
            }
            if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") {
              estadoLogin("Reintentando de otra forma…");
              firebase.auth().signInWithRedirect(proveedor()).catch(function (e2) {
                estadoLogin("");
                mostrarLogin({ error: explicar(e2) });
              });
              return;
            }
            estadoLogin("");
            mostrarLogin({ error: explicar(e) });
          });
        } catch (e) {
          estadoLogin("");
          mostrarLogin({ error: explicar(e) });
        }
      }

      function explicar(e) {
        var c = (e && e.code) || "";
        if (c === "auth/unauthorized-domain") {
          return "Esta dirección no está autorizada en Firebase. En la consola: <b>Authentication → Settings → Authorized domains</b>, agregá <b>" +
                 location.hostname + "</b>.";
        }
        if (c === "auth/operation-not-allowed") {
          return "El ingreso con Google todavía no está habilitado en Firebase: <b>Authentication → Sign-in method → Google</b>.";
        }
        if (c === "auth/network-request-failed") {
          return "No hay conexión con Google. La <b>primera</b> vez hace falta internet; después la sesión queda guardada.";
        }
        return (e && e.message) || "No pude completar el ingreso.";
      }

      // ================================================================
      //                    AISLAMIENTO ENTRE CUENTAS
      // ================================================================
      // Dos personas pueden usar el MISMO navegador. El localStorage es uno
      // solo por dirección, así que hay que borrar los datos del anterior
      // antes de bajar los del nuevo. Sin esto, lo que dejó uno se subiría
      // al documento del otro (que es exactamente el error que ya nos costó
      // una noche).
      function limpiarDatos() {
        var fuera = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (esDato(k)) fuera.push(k);
        }
        fuera.forEach(function (k) { try { localStorage.removeItem(k); } catch (_) {} });
        try { localStorage.removeItem(META); } catch (_) {}
        sucios = {};
        return fuera.length;
      }

      // ================================================================
      //                          ARRANQUE
      // ================================================================
      var montar = null, yaMonto = false, db = null;

      function montarUnaVez() {
        if (yaMonto || !montar) return;
        yaMonto = true;
        var root = document.getElementById("root");
        if (root) root.innerHTML = "";
        montar();
      }

      // Sin internet la primera vez no se puede entrar. Pero si esta persona
      // YA entró en este aparato, el dashboard tiene que seguir abriendo:
      // guarda todo local y sube cuando vuelva la señal.
      function modoLocal(motivo) {
        var dueno = null, mail = null, nombreGuardado = null;
        try {
          dueno = localStorage.getItem(OWNER);
          mail = localStorage.getItem(OWNER_MAIL);
          nombreGuardado = localStorage.getItem(OWNER_NAME);
        } catch (_) {}
        if (!dueno) {
          mostrarLogin({
            aviso: "La primera vez necesitás conexión para entrar con Google. Después la sesión queda guardada y el dashboard abre sin internet."
          });
          return;
        }
        estado.uid = dueno;
        window.JARVIS_PLANTILLA = (mail === DUENO);
        window.JarvisUsuario = { nombre: nombreGuardado || (mail || "").split("@")[0], email: mail || "", foto: "", salir: salir };
        fase("error", motivo || "sin conexión");
        montarUnaVez();
      }

      function salir() {
        try {
          if (window.firebase && firebase.auth) {
            firebase.auth().signOut().then(function () { location.reload(); }, function () { location.reload(); });
            return;
          }
        } catch (_) {}
        location.reload();
      }

      // Marca del último "reset" del documento visto por ESTE aparato. Cuando
      // un aparato declara "mis datos son la verdad" (reemplaza el documento
      // entero), los demás tienen que tirar lo suyo y bajar todo de cero; si
      // no, cualquier localStorage viejo resucitaría tareas borradas hace meses.
      var RESET_VISTO = "jarvis:resetVisto";
      function resetVisto() { try { return Number(localStorage.getItem(RESET_VISTO)) || 0; } catch (_) { return 0; } }
      function marcarReset(t) { try { localStorage.setItem(RESET_VISTO, String(t)); } catch (_) {} }

      // Reemplaza el documento ENTERO con lo que hay en este aparato (sin
      // merge): todo lo acumulado en la nube que no esté acá, muere. Es la
      // única forma de purgar datos viejos sin listarlos uno por uno.
      function reemplazarNube() {
        var t = Date.now();
        var m = {}, datos = {};
        clavesLocales().forEach(function (k) {
          var v = localStorage.getItem(k);
          if (v === null) return;
          m[k] = t;
          datos[k] = { v: v, t: t };
        });
        guardarMeta(m);
        sucios = {};
        marcarReset(t);
        return ref.set({ datos: datos, device: deviceId(), updatedAt: t, reset: t });
      }

      // Pantalla de decisión: este aparato tiene datos de ANTES de las cuentas
      // y la nube ya tiene datos de esta cuenta. Elegir mal pisa lo bueno, así
      // que se pregunta en vez de adivinar.
      function elegirOrigen(nLocales, nNube) {
        return new Promise(function (resolver) {
          var root = document.getElementById("root");
          if (!root) { resolver("nube"); return; }
          loginAbierto = true;
          var fondo = "#0d0b07", tarjeta = "#14100a", borde = "#3a2f14", texto = "#EBCB6E", suave = "#8a7a4d";
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:' + fondo + ';padding:24px;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;z-index:100;">' +
              '<div style="width:100%;max-width:420px;background:' + tarjeta + ';border:1px solid ' + borde + ';border-radius:18px;padding:30px 28px;text-align:left;">' +
                '<div style="font-family:Georgia,serif;font-size:18px;font-weight:600;color:' + texto + ';">Hay dos versiones de tus datos</div>' +
                '<div style="font-size:13px;color:' + suave + ';margin-top:10px;line-height:1.6;">' +
                  'Este aparato tiene datos guardados de antes de que existieran las cuentas (' + nLocales + '), y tu cuenta ya tiene datos en la nube (' + nNube + '). Elegí cuál es la versión buena; la otra se descarta <b>de los dos lados</b>.' +
                '</div>' +
                '<button id="jarvis-origen-local" style="margin-top:20px;width:100%;padding:12px 16px;border-radius:11px;border:1px solid ' + borde + ';background:#1c160c;color:' + texto + ';font-size:14px;font-weight:500;cursor:pointer;text-align:left;">' +
                  'Usar los datos de <b>este aparato</b><br><span style="font-size:11.5px;color:' + suave + ';font-weight:400;">Pisan la nube. Lo viejo acumulado en la nube se borra para siempre.</span>' +
                '</button>' +
                '<button id="jarvis-origen-nube" style="margin-top:10px;width:100%;padding:12px 16px;border-radius:11px;border:1px solid ' + borde + ';background:#1c160c;color:' + texto + ';font-size:14px;font-weight:500;cursor:pointer;text-align:left;">' +
                  'Traer los datos de <b>la nube</b><br><span style="font-size:11.5px;color:' + suave + ';font-weight:400;">Lo guardado en este aparato se borra y se baja todo de la cuenta.</span>' +
                '</button>' +
              '</div>' +
            '</div>';
          var bl = document.getElementById("jarvis-origen-local");
          var bn = document.getElementById("jarvis-origen-nube");
          if (bl) bl.addEventListener("click", function () { resolver("local"); });
          if (bn) bn.addEventListener("click", function () { resolver("nube"); });
        });
      }

      function entrar(user) {
        var uid = user.uid;
        var mail = (user.email || "").toLowerCase();
        estado.uid = uid;
        ref = db.collection("jarvis").doc(uid);

        // ¿Está autorizada esta cuenta? La respuesta la da el servidor: si la
        // regla la rechaza, esto tira "permission-denied". El mismo viaje trae
        // el documento, que hace falta para decidir el origen de los datos.
        var docNube = null;
        return ref.get({ source: "server" })
          .then(function (snap) {
            docNube = (snap && snap.exists && snap.data()) || null;
            return true;
          })
          .catch(function (e) {
            var c = (e && e.code) || "";
            if (c === "permission-denied") return false;
            return true;   // sin señal o error pasajero: se sigue, ya sincroniza cuando pueda
          })
          .then(function (permitido) {
            if (!permitido) {
              ref = null;
              return firebase.auth().signOut().catch(function () {}).then(function () {
                mostrarLogin({
                  error: "La cuenta <b>" + (mail || "esa") + "</b> no está autorizada. " +
                         "Pedile a Martín que la agregue a la lista y volvé a intentar."
                });
              });
            }

            // Cambio de persona en este navegador → borrón y cuenta nueva.
            var previo = null;
            try { previo = localStorage.getItem(OWNER); } catch (_) {}
            if (previo && previo !== uid) {
              var n = limpiarDatos();
              console.log("[Jarvis] otra cuenta en este navegador: borré " + n + " datos del anterior.");
            }

            // Primer login de esta cuenta en este aparato, CON datos huérfanos
            // (de antes de las cuentas) y CON nube no vacía: no se adivina.
            // Adoptar lo local a ciegas fue lo que resucitó tareas de versiones
            // viejas la última vez.
            var datosNube = (docNube && docNube.datos) || {};
            var clavesNube = Object.keys(datosNube).filter(function (k) { return esDato(k) && !datosNube[k].borrado; });
            var huerfanas = previo ? [] : clavesLocales();
            var decision = Promise.resolve(null);
            if (!previo && huerfanas.length && clavesNube.length) {
              decision = elegirOrigen(huerfanas.length + " datos", clavesNube.length + " datos");
            } else if (!previo && clavesNube.length) {
              // Sin datos locales: la nube manda, sin preguntar.
              decision = Promise.resolve("nube");
            }
            return decision.then(function (eleccion) {
              if (eleccion === "nube") {
                limpiarDatos();
                if (docNube && docNube.reset) marcarReset(docNube.reset);
              }
              var promesa = Promise.resolve();
              if (eleccion === "local") promesa = reemplazarNube().catch(function (e) {
                console.warn("[Jarvis] no pude reemplazar la nube, reintento como subida normal:", e);
                adoptarTodo();
              });
              return promesa.then(function () { return continuar(); });
            });

            function continuar() {
            try {
              localStorage.setItem(OWNER, uid);
              localStorage.setItem(OWNER_MAIL, mail);
              if (user.displayName) localStorage.setItem(OWNER_NAME, user.displayName);
              else localStorage.removeItem(OWNER_NAME);
            } catch (_) {}

            // Sólo la cuenta dueña ve la rutina y los objetivos precargados;
            // cualquier otra arranca en blanco y arma los suyos.
            window.JARVIS_PLANTILLA = (mail === DUENO);
            window.JarvisUsuario = {
              nombre: user.displayName || mail.split("@")[0],
              email: mail,
              foto: user.photoURL || "",
              salir: salir
            };

            cerrarLogin();
            fase("ok");

            ref.onSnapshot(function (snap) {
              var d = (snap && snap.exists && snap.data()) || {};
              var propio = d.device === deviceId();
              // Otro aparato reemplazó el documento entero ("mis datos son la
              // verdad"): acá se tira todo lo local y se baja de cero. Sin esto,
              // el localStorage viejo de este aparato volvería a subir tareas
              // que el otro acaba de purgar.
              if (d.reset && d.reset > resetVisto() && !propio) {
                var borradas = limpiarDatos();
                marcarReset(d.reset);
                console.log("[Jarvis] otro aparato purgó la nube: descarté " + borradas + " datos locales y bajo todo de cero.");
              }
              var cambios = reconciliar(d.datos || {});
              estado.ultima = new Date();
              if (estado.fase !== "subiendo") fase("ok");
              // Si llegaron datos de OTRO aparato hay que redibujar todo.
              if (cambios > 0 && montado && !propio) pedirRecarga();
            }, function (e) {
              fase("error", (e && e.message) || "se cortó la conexión");
            });

            montarUnaVez();
            }   // fin continuar()
          });
      }

      }

      function arrancar(fnMontar) {
        montar = fnMontar;
        fase("conectando");
        esperando("Un momento\u2026");
        return cargar(SDK + "firebase-app-compat.js")
          .then(function () { return cargar(SDK + "firebase-auth-compat.js"); })
          .then(function () { return cargar(SDK + "firebase-firestore-compat.js"); })
          .then(function () {
            firebase.initializeApp(CFG);
            db = firebase.firestore();
            // Que siga andando sin señal: los cambios se guardan y se mandan
            // solos cuando vuelve internet.
            return db.enablePersistence({ synchronizeTabs: true })
              .catch(function () { /* otra pestaña ya la tomó, o el navegador no la soporta */ });
          })
          .then(function () {
            // Vuelta del redirect de Google (celular / app instalada).
            return firebase.auth().getRedirectResult().catch(function (e) {
              pendienteError = explicar(e);
            });
          })
          .then(function () {
            firebase.auth().onAuthStateChanged(function (user) {
              if (user) {
                entrar(user);
              } else if (!yaMonto) {
                mostrarLogin(pendienteError ? { error: pendienteError } : {});
                pendienteError = null;
              }
            }, function (e) {
              modoLocal(explicar(e));
            });
          })
          .catch(function (e) {
            // No cargaron los SDK (sin internet, CDN bloqueado, etc.)
            console.warn("[Jarvis] sin nube:", e);
            modoLocal((e && e.message) || "sin conexión");
          });
      }
      var pendienteError = null;

      // Un import de archivo escribe directo en localStorage, salteándose el
      // shim. Se marca todo para que suba a la nube igual.
      function adoptarTodo() {
        var m = meta(), t = Date.now();
        clavesLocales().forEach(function (k) { m[k] = t; sucios[k] = true; });
        guardarMeta(m);
        programarSubida(500);
      }

      window.JarvisSync = {
        arrancar: arrancar,
        // "iniciar" queda por compatibilidad: el botón de la nube lo llama
        // cuando está en error, y ahí lo más sano es recargar de cero.
        iniciar: function () { location.reload(); },
        // Reparación manual desde la pestaña "Cuenta y datos":
        // purgarNube → este aparato pisa el documento entero (con marca de
        // reset, así los demás aparatos descartan lo suyo y bajan de cero).
        // traerNube → este aparato tira lo local y baja todo de la cuenta.
        purgarNube: function () {
          if (!ref) return Promise.reject(new Error("no hay sesión iniciada"));
          return reemplazarNube();
        },
        traerNube: function () {
          limpiarDatos();
          try { localStorage.removeItem(RESET_VISTO); } catch (_) {}
          location.reload();
        },
        usuario: function () { return window.JarvisUsuario || null; },
        estado: function () { return { fase: estado.fase, detalle: estado.detalle, ultima: estado.ultima, pendientes: estado.pendientes, uid: estado.uid }; },
        onEstado: function (cb) { oyentes.push(cb); cb(window.JarvisSync.estado()); },
        forzar: function () { adoptarTodo(); },
        montado: function () { montado = true; },
        subirYa: function () { clearTimeout(timer); subir(); }
      };

      // Si se importa un backup, que también vaya a la nube.
      if (window.JarvisBackup && window.JarvisBackup.importFile) {
        var impOrig = window.JarvisBackup.importFile;
        window.JarvisBackup.importFile = function (f) {
          return impOrig.call(window.JarvisBackup, f).then(function (n) {
            if (n > 0) adoptarTodo();
            return n;
          });
        };
      }
    })();
  </script>
